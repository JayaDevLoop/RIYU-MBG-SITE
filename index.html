<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;

  /* BACKGROUND GAMBAR */
  background-image: url("https://drive.google.com/uc?export=view&id=1fUBBiVz56l0sFVHK5-tKMxh-56F9aN69");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* gelap biar teks kebaca */
.overlay {
  background: rgba(0,0,0,0.6);
  min-height: 100vh;
}

/* TOP BAR */
.topbar {
  padding: 15px;
  text-align: center;
  border-bottom: 2px solid cyan;
  background: rgba(0,0,0,0.5);
}

.topbar h1 {
  margin: 0;
  color: cyan;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  padding: 15px;
}

/* CARD */
.card {
  background: rgba(30,30,30,0.9);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.content {
  padding: 10px;
  text-align: center;
}

.btn {
  display: inline-block;
  margin-top: 8px;
  padding: 8px 12px;
  background: cyan;
  color: black;
  font-weight: bold;
  text-decoration: none;
  border-radius: 8px;
}

.btn:hover {
  background: #00bcd4;
}
</style>

</head>

<body>

<div class="overlay">

  <!-- HEADER -->
  <div class="topbar">
    <h1>🎮 Game Store</h1>
    <p>Download game gratis 🔥</p>
  </div>

  <!-- GAME LIST -->
  <div class="container">

    <!-- GAME 1 -->
    <div class="card">
      <img src="https://via.placeholder.com/300x200
