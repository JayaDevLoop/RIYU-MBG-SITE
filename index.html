<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Gue</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .card {
      max-width: 350px;
      margin: 60px auto;
      background: #1c1c1c;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
    }

    img {
      width: 100%;
    }

    .content {
      padding: 15px;
    }

    h1 {
      color: cyan;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 18px;
      background: cyan;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    .btn:hover {
      background: #00bcd4;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- GAMBAR GAME -->
    <img src="https://via.placeholder.com/400x200.png?text=Game+Kamu" alt="Game Cover">

    <div class="content">
      <h1>Nama Game Kamu</h1>
      <p>Download game seru ini gratis!</p>

      <!-- LINK DOWNLOAD -->
      <a class="btn" href="https://example.com" target="_blank">
        Download Game
      </a>
    </div>

  </div>

</body>
</html>
